[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bbtcomp"
version = "0.4.0"
description = "Bayesian Bradley-Terry models to compare multiple algorithms on multiple data sets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Jacques Wainer", email = "wainer@ic.unicamp.br" },
]
keywords = ["bayesian", "bradley-terry", "statistics", "benchmark", "stan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "cmdstanpy>=1.1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
waic = ["arviz>=0.14"]
test = ["pytest>=7.0", "matplotlib>=3.5", "arviz>=0.14"]

[project.urls]
Homepage = "https://github.com/jwainer/bbtcomp"

[tool.hatch.build.targets.wheel]
packages = ["src/bbtcomp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/bbtcomp",
    "tests",
    "README.md",
    "LICENSE",
]
